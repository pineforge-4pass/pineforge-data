# SPDX-License-Identifier: Apache-2.0
name: Native feed
on:
  push:
    branches: [main]
    paths: ['native/feed/**', '.github/workflows/native-feed.yml']
  pull_request:
    paths: ['native/feed/**', '.github/workflows/native-feed.yml']
  workflow_dispatch:

permissions:
  contents: read

# Only a superseded pull_request run is cancelled; push and dispatch are never cancelled.
# authz, asan-ubsan, tsan and the Linux release legs run on the pf-ci pool (x64 and arm64 labels, no hosted fallback).
# Fork PRs fail authz; only macos-14 stays on GitHub.
concurrency:
  group: native-feed-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  authz:
    name: authz
    # Pool label (needs no toolchain or Docker). Switch to pf-ci-crj once laneboss's
    # bulletin says the Cloud Run class is live.
    runs-on: ["self-hosted", "pf-ci", "pf-ci-x64"]
    permissions: {}
    # No timeout-minutes: the owner's no-time-limits rule (check-no-time-limits refuses new ones).
    steps:
      - name: Only our own pull requests and our own events run CI
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ github.token }}   # read-only use: one permission lookup for workflow_run
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -eu
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            push|workflow_dispatch|schedule|merge_group|release|workflow_call|repository_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            workflow_run)
              # The pwn-request path: it runs in THIS repository with secrets even when the triggering run
              # came from a fork. Refuse ALWAYS unless the triggering run's head is this repository, and
              # apply the same identity rule to its triggering actor as to a pull-request author.
              [ "$WR_HEAD_REPO" = "$REPO" ] || fail "workflow_run triggered from another repository (${WR_HEAD_REPO:-unknown})"
              case " $ALLOWED_BOTS " in
                *" $WR_ACTOR "*) ;;
                *)
                  # No author_association exists on workflow_run: ask GitHub for the actor's permission on
                  # this repository; anything but admin/maintain/write (or a failed call) refuses.
                  perm=$(gh api "repos/$REPO/collaborators/$WR_ACTOR/permission" --jq .permission 2>/dev/null || echo none)
                  case "$perm" in admin|maintain|write) ;; *) fail "workflow_run triggering actor ${WR_ACTOR:-unknown} has permission '$perm', not write" ;; esac ;;
              esac ;;
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) is not an owner, member, collaborator or allowlisted bot" ;;
                  esac ;;
              esac ;;
            *) fail "event $EVENT does not run CI (pull_request_target and other events are not allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release (${{ matrix.os }})
    needs: authz
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        include:
          - os: ubuntu-24.04
            runner: ["self-hosted", "pf-ci", "pf-ci-x64"]
          - os: ubuntu-24.04-arm
            runner: ["self-hosted", "pf-ci", "pf-ci-arm64"]
          # The one named exception: macOS stays on GitHub-hosted until there is Mac hardware.
          - os: macos-14
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - name: macOS prerequisites
        if: runner.os == 'macOS'
        run: |
          brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Pinned WebSocket curl
        run: bash native/feed/tests/build_ci_curl.sh "$RUNNER_TEMP/curl"
      - name: Configure, build and test
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/curl/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$RUNNER_TEMP/curl/lib:${DYLD_LIBRARY_PATH:-}"
          cmake -S native/feed -B build-feed -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCURL_DIR="$RUNNER_TEMP/curl/lib/cmake/CURL"
          cmake --build build-feed -j4
          ctest --test-dir build-feed --output-on-failure

  asan-ubsan:
    name: ASan + UBSan
    needs: authz
    runs-on: ["self-hosted", "pf-ci", "pf-ci-x64"]
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev clang-18
      - run: bash native/feed/tests/build_ci_curl.sh "$RUNNER_TEMP/curl"
      - name: Instrumented core and mock venue
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/curl/lib:${LD_LIBRARY_PATH:-}"
          cmake -S native/feed -B build-feed -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_C_COMPILER=clang-18 -DCURL_DIR="$RUNNER_TEMP/curl/lib/cmake/CURL" \
            -DPINEFORGE_FEED_SANITIZER=address,undefined
          cmake --build build-feed -j4
          ctest --test-dir build-feed --output-on-failure

  tsan:
    name: TSan
    needs: authz
    runs-on: ["self-hosted", "pf-ci", "pf-ci-x64"]
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev clang-18 llvm-18
      - run: bash native/feed/tests/build_ci_curl.sh "$RUNNER_TEMP/curl"
      - name: Check TSan symbolizer
        run: |
          # With no symbolizer configured, TSan can fall back and still symbolize.
          # A wrong explicit path breaks symbolization and makes race:STOP_FLAG_ASSIGN inert.
          if ! test -x /usr/lib/llvm-18/bin/llvm-symbolizer; then
            echo "::error::TSan requires an executable /usr/lib/llvm-18/bin/llvm-symbolizer for function-name suppressions; install llvm-18." >&2
            exit 1
          fi
      - name: Threaded receive, healing, termination and serve fan-out
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/curl/lib:${LD_LIBRARY_PATH:-}"
          cmake -S native/feed -B build-feed -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_C_COMPILER=clang-18 -DCURL_DIR="$RUNNER_TEMP/curl/lib/cmake/CURL" \
            -DPINEFORGE_FEED_SANITIZER=thread \
            -DPINEFORGE_FEED_TSAN_OPTIONS_EXTRA=external_symbolizer_path=/usr/lib/llvm-18/bin/llvm-symbolizer
          cmake --build build-feed -j4
          ctest --test-dir build-feed --output-on-failure

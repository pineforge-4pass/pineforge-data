name: PineForge release adapter

on:
  repository_dispatch:
    types: [pineforge-release]
  workflow_run:
    workflows: [CI, Release]
    types: [completed]
  # schedule (9,24,39,54 * * * *) removed 2026-10-18: every run failed and Actions cost is capped (owner); dispatch and the triggers above remain.
  workflow_dispatch:
    inputs:
      publication_run:
        description: Completed Release run to verify (automated repair uses the immutable package tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: data-release-adapter
  cancel-in-progress: false

jobs:
  reconcile:
    # Automatic triggers (schedule, workflow_run) run only once the chain is
    # configured (RELEASE_APP_ID set); a hub dispatch or a manual run without it
    # still fails loudly.
    if: >-
      (vars.RELEASE_APP_ID != '' || (github.event_name != 'schedule' && github.event_name != 'workflow_run')) &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.name == 'CI' && github.event.workflow_run.event == 'pull_request') ||
      github.event.workflow_run.name == 'Release')
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify ready event, reconcile update PR and respect release gates
        if: github.event.workflow_run.name != 'Release' && inputs.publication_run == ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
        run: python scripts/release_adapter.py reconcile --receipt "$RUNNER_TEMP/release-receipt.json"
      - name: Verify the completed publication from trusted coordinator code
        if: github.event.workflow_run.name == 'Release' || inputs.publication_run != ''
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PUBLICATION_RUN: ${{ inputs.publication_run || github.event.workflow_run.id }}
        run: python -m release_chain.reporting publication --run "$PUBLICATION_RUN" --receipt "$RUNNER_TEMP/release-receipt.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-10-adapter
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: warn

  report:
    if: always() && needs.reconcile.result != 'skipped'
    needs: reconcile
    uses: ./.github/workflows/release-report.yml
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      hub: true
      failed: ${{ needs.reconcile.result != 'success' }}
      stage: reconcile
    secrets: inherit

name: Release receipt and incident

on:
  workflow_call:
    inputs:
      failed:
        type: boolean
        required: true
      stage:
        type: string
        required: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          pattern: release-receipt-${{ github.run_attempt }}-*
          path: receipts
      - name: Preserve consumer details and alert the configured owner
        id: receipt
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ inputs.failed }}
          STAGE: ${{ inputs.stage }}
          RELEASE_ALERT_OWNER: ${{ vars.RELEASE_ALERT_OWNER }}
        run: python -m release_chain.reporting collect
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: consumer-release-receipt-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: error
      - name: Mint a separate token scoped only to the hub
        if: steps.receipt.outputs.has_event == 'true'
        uses: actions/create-github-app-token@v2
        id: hub
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: pineforge-4pass
          repositories: pineforge-release
          permission-contents: write
      - name: Send neutral completion state to the hub receiver
        if: steps.receipt.outputs.has_event == 'true'
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ steps.hub.outputs.token }}
          RELEASE_RECEIPT_EVENT_TYPE: ${{ vars.RELEASE_RECEIPT_EVENT_TYPE }}
        run: python -m release_chain.reporting callback
      - name: Alert locally if receipt delivery or reporting failed
        if: failure()
        env:
          PYTHONPATH: scripts
          GH_TOKEN: ${{ github.token }}
          FAILED: 'true'
          STAGE: receipt-transport
          RELEASE_ALERT_OWNER: ${{ vars.RELEASE_ALERT_OWNER }}
        run: python -m release_chain.reporting collect
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: consumer-release-reporting-failure-${{ github.run_attempt }}
          path: receipt.json
          if-no-files-found: warn

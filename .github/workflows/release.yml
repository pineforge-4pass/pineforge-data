name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component for an App-created, CI-gated package PR
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      ci_run:
        description: Optional successful landed main CI run ID to replay publication without a bump
        required: false
        type: string
      rollback_package:
        description: Optional previously verified data package; opens a tested forward patch rollback PR
        required: false
        type: string
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONPATH: scripts

jobs:
  manual-pr:
    if: github.event_name == 'workflow_dispatch' && inputs.ci_run == ''
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    concurrency:
      group: data-release-adapter
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Create or reuse a version PR; merge only after its own CI and E2E
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          BUMP: ${{ inputs.bump }}
          ROLLBACK_PACKAGE: ${{ inputs.rollback_package }}
        run: |
          test "$GITHUB_REF_NAME" = main
          if [ -n "$ROLLBACK_PACKAGE" ]; then
            python scripts/release_adapter.py rollback --package "$ROLLBACK_PACKAGE" --receipt "$RUNNER_TEMP/release-receipt.json"
          else
            python scripts/release_adapter.py manual --bump "$BUMP" --receipt "$RUNNER_TEMP/release-receipt.json"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-10-manual
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: warn

  prepare:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.ci_run != '')
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      has_target: ${{ steps.release.outputs.has_target }}
      published: ${{ steps.release.outputs.published }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Require the landed PR, complete CI inventory and exact tested distributions
        id: release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          CI_RUN: ${{ inputs.ci_run || github.event.workflow_run.id }}
        run: |
          python -m release_chain.publishing prepare --run "$CI_RUN" \
            --directory "$RUNNER_TEMP/bundle" --receipt "$RUNNER_TEMP/release-receipt.json"
      - uses: actions/upload-artifact@v5
        if: steps.release.outputs.eligible == 'true'
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-20-prepare
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: warn

  build:
    if: needs.prepare.outputs.eligible == 'true'
    needs: prepare
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: bundle/
      - name: Verify release tag and source version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/verify_release.py "$TAG" --pyproject bundle/source/pyproject.toml
      - name: Preserve the exact already-built and exercised CI distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions-${{ github.run_attempt }}
          path: bundle/dist/
          if-no-files-found: error

  github-release:
    needs: [prepare, build]
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: bundle/
      - uses: actions/download-artifact@v6
        if: needs.prepare.outputs.has_target == 'true'
        with:
          name: release-stage-${{ github.run_attempt }}-20-prepare
          path: report/
      - name: Retain immutable tag and distribution assets with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m release_chain.publishing github-release --directory bundle --receipt report/release-receipt.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-30-github
          path: report/release-receipt.json
          if-no-files-found: warn

  publish:
    if: needs.prepare.outputs.eligible == 'true' && needs.prepare.outputs.published != 'true'
    needs: [prepare, build, github-release]
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    environment:
      name: pypi
      url: https://pypi.org/project/pineforge-data/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: bundle/
      - uses: actions/download-artifact@v6
        if: needs.prepare.outputs.has_target == 'true'
        with:
          name: release-stage-${{ github.run_attempt }}-30-github
          path: report/
      - name: Recheck desired identity and tested bytes immediately before OIDC publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m release_chain.publishing preflight --directory bundle --receipt report/release-receipt.json
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bundle/dist/
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-40-publish
          path: report/release-receipt.json
          if-no-files-found: warn

  verify:
    if: >-
      always() && needs.prepare.outputs.eligible == 'true' &&
      needs.github-release.result == 'success' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.published == 'true')
    needs: [prepare, github-release, publish]
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-latest' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: bundle/
      - uses: actions/download-artifact@v6
        if: needs.prepare.outputs.has_target == 'true'
        with:
          name: release-stage-${{ github.run_attempt }}-30-github
          path: report/
      - name: Verify PyPI inventory and downloaded bytes before reporting success
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m release_chain.publishing verify --directory bundle --receipt report/release-receipt.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-50-verify
          path: report/release-receipt.json
          if-no-files-found: warn

  report:
    if: always()
    needs: [manual-pr, prepare, build, github-release, publish, verify]
    uses: ./.github/workflows/release-report.yml
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      stage: ${{ needs.publish.result == 'failure' && 'pypi-upload' || needs.verify.result == 'failure' && 'verify-publication' || needs.github-release.result == 'failure' && 'github-release' || needs.build.result == 'failure' && 'distribution-transfer' || needs.prepare.result == 'failure' && 'prepare-publication' || needs.manual-pr.result == 'failure' && 'prepare-pr' || 'publication' }}
    secrets: inherit

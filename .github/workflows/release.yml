name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component for an App-created, CI-gated package PR
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      ci_run:
        description: Optional successful landed main CI run ID to replay publication without a bump
        required: false
        type: string
      rollback_package:
        description: Optional previously verified data package; opens a tested forward patch rollback PR
        required: false
        type: string
      claim_placeholder:
        description: claims the PyPI name tunaxis-data with a 0.0.1 placeholder
        default: false
        required: false
        type: boolean
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONPATH: scripts

jobs:
  authz:
    name: authz
    # Pool label (needs no toolchain or Docker). Switch to pf-ci-crj once laneboss's
    # bulletin says the Cloud Run class is live.
    runs-on: ["self-hosted", "pf-ci", "pf-ci-x64"]
    permissions: {}
    # No timeout-minutes: the owner's no-time-limits rule (check-no-time-limits refuses new ones).
    steps:
      - name: Only our own pull requests and our own events run CI
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          GH_TOKEN: ${{ github.token }}   # read-only use: one permission lookup for workflow_run
          # Bot logins whose same-repository pull requests count as ours: dependabot[bot] (CI-DEPBOT A)
          # and the org's own GitHub App bot logins by name (space-separated), nothing else.
          ALLOWED_BOTS: "dependabot[bot] pineforge-app[bot]"
        run: |
          set -eu
          fail() { echo "::error title=authz::$1"; echo "authz: REFUSED: $1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          case "$EVENT" in
            push|workflow_dispatch|schedule|merge_group|release|workflow_call|repository_dispatch)
              # Only someone with write access to this repository (or our App's token) can cause these
              # events; none of them runs pull-request code.
              ;;
            workflow_run)
              # The pwn-request path: it runs in THIS repository with secrets even when the triggering run
              # came from a fork. Refuse ALWAYS unless the triggering run's head is this repository, and
              # apply the same identity rule to its triggering actor as to a pull-request author.
              [ "$WR_HEAD_REPO" = "$REPO" ] || fail "workflow_run triggered from another repository (${WR_HEAD_REPO:-unknown})"
              case " $ALLOWED_BOTS " in
                *" $WR_ACTOR "*) ;;
                *)
                  # No author_association exists on workflow_run: ask GitHub for the actor's permission on
                  # this repository; anything but admin/maintain/write (or a failed call) refuses.
                  perm=$(gh api "repos/$REPO/collaborators/$WR_ACTOR/permission" --jq .permission 2>/dev/null || echo none)
                  case "$perm" in admin|maintain|write) ;; *) fail "workflow_run triggering actor ${WR_ACTOR:-unknown} has permission '$perm', not write" ;; esac ;;
              esac ;;
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || fail "pull request from another repository (${HEAD_REPO:-unknown})"
              [ "$HEAD_IS_FORK" = "false" ] || fail "pull request from a fork"
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *)
                  case " $ALLOWED_BOTS " in
                    *" $PR_AUTHOR "*) ;;
                    *)
                      # A member whose org membership is private shows as CONTRIBUTOR: ask GitHub for the
                      # author's permission on this repository; anything but admin/maintain/write (or a
                      # failed call) refuses.
                      perm=$(gh api "repos/$REPO/collaborators/$PR_AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
                      case "$perm" in admin|maintain|write) ;; *) fail "author ${PR_AUTHOR:-unknown} (${ASSOCIATION:-NONE}) has permission '$perm', not write, and is not an allowlisted bot" ;; esac ;;
                  esac ;;
              esac ;;
            *) fail "event $EVENT does not run CI (pull_request_target and other events are not allowed)" ;;
          esac
          echo "authz: allowed ($EVENT${PR_AUTHOR:+ by $PR_AUTHOR})" >> "$GITHUB_STEP_SUMMARY"

  claim-name:
    needs: authz
    # bump is required and defaults to patch; claim runs pass that default, which
    # the skipped release jobs never read.
    # The pypi environment allows only main and v* refs; dispatch claims from main.
    # The shared concurrency group release prevents a claim from overlapping a release.
    if: ${{ inputs.claim_placeholder }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/tunaxis-data/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Write placeholder package
        id: claim
        run: |
          claim_dir=$RUNNER_TEMP/claim
          package_dir=$claim_dir/tunaxis_data
          dist_dir=$claim_dir/dist
          mkdir -p "$package_dir"
          cd "$claim_dir"
          cat > pyproject.toml <<'PYPROJECT'
          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"

          [project]
          name = "tunaxis-data"
          version = "0.0.1"
          description = "Tunaxis: first release coming soon."
          readme = "README.md"
          requires-python = ">=3.11"
          license = { text = "Apache-2.0" }
          classifiers = [
            "Development Status :: 1 - Planning",
            "License :: OSI Approved :: Apache Software License",
            "Programming Language :: Python :: 3",
          ]

          [tool.hatch.build.targets.wheel]
          packages = ["tunaxis_data"]

          [tool.hatch.build.targets.sdist]
          include = ["tunaxis_data", "README.md", "pyproject.toml"]
          PYPROJECT
          cat > README.md <<'README'
          Tunaxis: first release coming soon. https://tunaxis.com
          README
          cat > tunaxis_data/__init__.py <<'PACKAGE'
          __version__ = "0.0.1"
          PACKAGE
          printf 'directory=%s\ndist=%s\n' "$claim_dir" "$dist_dir" >> "$GITHUB_OUTPUT"
      - name: Build placeholder distributions
        working-directory: ${{ steps.claim.outputs.directory }}
        run: |
          python -m pip install build
          python -m build
      - name: Verify placeholder distributions
        working-directory: ${{ steps.claim.outputs.directory }}
        run: |
          cat > verify.py <<'VERIFY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path('dist')
          expected = {
              'tunaxis_data-0.0.1.tar.gz',
              'tunaxis_data-0.0.1-py3-none-any.whl',
          }
          if {path.name for path in dist.iterdir()} != expected:
              raise SystemExit('Unexpected distribution files')
          with zipfile.ZipFile(dist / 'tunaxis_data-0.0.1-py3-none-any.whl') as wheel:
              names = wheel.namelist()
              metadata = 'tunaxis_data-0.0.1.dist-info/'
              if (
                  'tunaxis_data/__init__.py' not in names
                  or not any(name.startswith(metadata) for name in names)
                  or any(name != 'tunaxis_data/__init__.py' and not name.startswith(metadata) for name in names)
              ):
                  raise SystemExit('Unexpected wheel contents')
              wheel.extractall('unpacked-wheel')
          with tarfile.open(dist / 'tunaxis_data-0.0.1.tar.gz') as sdist:
              sdist.extractall('unpacked-sdist', filter='data')
          readme = Path('unpacked-sdist/tunaxis_data-0.0.1/README.md')
          if readme.read_bytes() != b'Tunaxis: first release coming soon. https://tunaxis.com\n':
              raise SystemExit('Unexpected README contents')
          VERIFY
          python verify.py
          if grep -ri pineforge unpacked-sdist unpacked-wheel; then
            exit 1
          else
            status=$?
            test "$status" -eq 1
          fi
      - name: Publish placeholder to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ steps.claim.outputs.dist }}

  manual-pr:
    needs: authz
    if: github.event_name == 'workflow_dispatch' && inputs.ci_run == '' && !inputs.claim_placeholder
    runs-on: ubuntu-latest
    concurrency:
      group: data-release-adapter
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Create or reuse a version PR; merge only after its own CI and E2E
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          BUMP: ${{ inputs.bump }}
          ROLLBACK_PACKAGE: ${{ inputs.rollback_package }}
        run: |
          test "$GITHUB_REF_NAME" = main
          if [ -n "$ROLLBACK_PACKAGE" ]; then
            python scripts/release_adapter.py rollback --package "$ROLLBACK_PACKAGE" --receipt "$RUNNER_TEMP/release-receipt.json"
          else
            python scripts/release_adapter.py manual --bump "$BUMP" --receipt "$RUNNER_TEMP/release-receipt.json"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-10-manual
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: warn

  prepare:
    needs: authz
    if: >-
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.ci_run != '')) && !inputs.claim_placeholder
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      has_target: ${{ steps.release.outputs.has_target }}
      published: ${{ steps.release.outputs.published }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Require the landed PR, complete CI inventory and exact tested distributions
        id: release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_BOT_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          CI_RUN: ${{ inputs.ci_run || github.event.workflow_run.id }}
        run: |
          python -m release_chain.publishing prepare --run "$CI_RUN" \
            --directory "$RUNNER_TEMP/bundle" --receipt "$RUNNER_TEMP/release-receipt.json"
      - uses: actions/upload-artifact@v5
        if: steps.release.outputs.eligible == 'true'
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-20-prepare
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: warn

  build:
    if: needs.prepare.outputs.eligible == 'true' && !inputs.claim_placeholder
    needs: [authz, prepare]
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-24.04' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: bundle/
      - name: Verify release tag and source version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: python scripts/verify_release.py "$TAG" --pyproject bundle/source/pyproject.toml
      - name: Preserve the exact already-built and exercised CI distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions-${{ github.run_attempt }}
          path: bundle/dist/
          if-no-files-found: error

  github-release:
    needs: [authz, prepare, build]
    if: needs.prepare.outputs.eligible == 'true' && !inputs.claim_placeholder
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-24.04' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: bundle/
      - uses: actions/download-artifact@v6
        if: needs.prepare.outputs.has_target == 'true'
        with:
          name: release-stage-${{ github.run_attempt }}-20-prepare
          path: report/
      - name: Retain immutable tag and distribution assets with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m release_chain.publishing github-release --directory bundle --receipt report/release-receipt.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-30-github
          path: report/release-receipt.json
          if-no-files-found: warn

  publish:
    if: needs.prepare.outputs.eligible == 'true' && needs.prepare.outputs.published != 'true' && !inputs.claim_placeholder
    needs: [authz, prepare, build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pineforge-data/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: bundle/
      - uses: actions/download-artifact@v6
        if: needs.prepare.outputs.has_target == 'true'
        with:
          name: release-stage-${{ github.run_attempt }}-30-github
          path: report/
      - name: Recheck desired identity and tested bytes immediately before OIDC publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m release_chain.publishing preflight --directory bundle --receipt report/release-receipt.json
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bundle/dist/
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-40-publish
          path: report/release-receipt.json
          if-no-files-found: warn

  verify:
    if: >-
      always() && needs.authz.result == 'success' && needs.prepare.outputs.eligible == 'true' &&
      needs.github-release.result == 'success' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.published == 'true') && !inputs.claim_placeholder
    needs: [authz, prepare, github-release, publish]
    runs-on: >-
      ${{ github.event_name != 'pull_request_target' &&
          github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]' &&
          contains(fromJSON('["push","pull_request","workflow_dispatch","schedule","release"]'), github.event_name) &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)) &&
          fromJSON('["self-hosted","pf-ci","pf-ci-x64"]') || 'ubuntu-24.04' }}
    env:
      PF_CI_LABELS: '["self-hosted","pf-ci","pf-ci-x64"]'
    permissions:
      contents: write
      actions: read
    steps:
      - name: authz must have passed
        if: needs.authz.result != 'success'
        run: exit 1
      - uses: actions/checkout@v7
        if: needs.authz.result == 'success'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: validated-release-bundle-${{ github.run_attempt }}
          path: bundle/
      - uses: actions/download-artifact@v6
        if: needs.prepare.outputs.has_target == 'true'
        with:
          name: release-stage-${{ github.run_attempt }}-30-github
          path: report/
      - name: Verify PyPI inventory and downloaded bytes before reporting success
        if: needs.authz.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m release_chain.publishing verify --directory bundle --receipt report/release-receipt.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: release-stage-${{ github.run_attempt }}-50-verify
          path: report/release-receipt.json
          if-no-files-found: warn

  report:
    if: always() && needs.authz.result == 'success' && !inputs.claim_placeholder
    needs: [authz, manual-pr, prepare, build, github-release, publish, verify]
    uses: ./.github/workflows/release-report.yml
    permissions:
      contents: read
      actions: read
      issues: write
    with:
      failed: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      stage: ${{ needs.publish.result == 'failure' && 'pypi-upload' || needs.verify.result == 'failure' && 'verify-publication' || needs.github-release.result == 'failure' && 'github-release' || needs.build.result == 'failure' && 'distribution-transfer' || needs.prepare.result == 'failure' && 'prepare-publication' || needs.manual-pr.result == 'failure' && 'prepare-pr' || 'publication' }}
    secrets: inherit

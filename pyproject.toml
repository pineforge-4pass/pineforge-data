[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "tunaxis-data"
version = "0.3.0"
description = "Provider-neutral market data adapters and raw-PineScript backtest harness for Tunaxis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tunaxis contributors" }]
keywords = ["tunaxis", "pinescript", "backtesting", "market-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
tunaxis-backtest = "tunaxis_data.cli.backtest:main"
tunaxis-backtest-server = "tunaxis_data.server:main"

[project.optional-dependencies]
ccxt = ["ccxt>=4.5.64,<5"]
database = ["sqlalchemy>=2.0,<3"]
database-e2e = [
    "sqlalchemy>=2.0,<3",
    "pymysql>=1.1,<2",
    "psycopg[binary]>=3.2,<4",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mkdocstrings-python>=2.0,<3",
    "ruff>=0.8",
]
server = [
    "fastapi>=0.139,<0.140",
    "uvicorn>=0.51,<0.52",
]
release = [
    "build>=1.2,<2",
    "twine>=7,<8",
]
dev = [
    "build>=1.2",
    "fastapi>=0.139,<0.140",
    "hatchling>=1.26",
    "httpx2>=2.5,<2.6",
    "mypy>=1.13",
    "pytest>=8.3",
    "PyYAML>=6,<7",
    "ruff>=0.8",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.51,<0.52",
]

[project.urls]
Homepage = "https://github.com/pineforge-4pass/pineforge-data"
Documentation = "https://pineforge-4pass.github.io/pineforge-data/"
Issues = "https://github.com/pineforge-4pass/pineforge-data/issues"
Source = "https://github.com/pineforge-4pass/pineforge-data"

[tool.hatch.build.targets.wheel]
packages = ["src/tunaxis_data"]

[tool.hatch.build.targets.sdist]
exclude = ["/native", "/src/pineforge_data", "/shim"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
extend-exclude = ["vendor"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tunaxis_data"]
mypy_path = "src"
